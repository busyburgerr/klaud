# Конфиг сайта для nginx.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cloud
#   sudo ln -s /etc/nginx/sites-available/cloud /etc/nginx/sites-enabled/cloud
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Замените klaud.ru на свой домен. HTTPS добавит certbot (см. deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name klaud.ru www.klaud.ru;

    # Фотографии лота — до 5 МБ, до 10 штук за раз.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Собранные ассеты Vite содержат хеш в имени — кэшируем надолго.
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
